name: Branch source policy

on:
  pull_request_target:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: branch-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  branch_policy:
    runs-on: ubuntu-latest
    steps:
      # Resolve the current protected base; old PR payload SHAs can predate this gate.
      # Never check out or execute PR-head code with this token.
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const check = require('./.github/scripts/branch-policy.cjs');
            await check({github, context, core});

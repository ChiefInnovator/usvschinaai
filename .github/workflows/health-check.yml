name: Site Health Check

# Uptime + data-freshness monitor. A failing run triggers GitHub's normal
# workflow-failure email — the alert channel that was missing during the
# Aug 16-29 outage, when the site was down for 13 days while every deploy
# workflow reported green.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Site reachable (custom domain)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://usvschina.ai/ || echo "000")
          echo "usvschina.ai -> HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::usvschina.ai unreachable (HTTP $STATUS) — check DNS / Azure subscription billing state"
            exit 1
          fi

      - name: Site reachable (SWA default hostname)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://orange-desert-08276c810.4.azurestaticapps.net/ || echo "000")
          echo "SWA default host -> HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Static Web App default hostname unreachable (HTTP $STATUS)"
            exit 1
          fi

      - name: Data freshness (scrape ran within 30h)
        run: |
          curl -sf --max-time 30 https://usvschina.ai/current.json -o current.json \
            || curl -sf --max-time 30 https://usvschina.ai/models.json -o current.json
          python3 - <<'EOF'
          import json, sys
          from datetime import datetime, timezone, timedelta
          with open("current.json") as f:
              data = json.load(f)
          teams = data["history"][0].get("teams", {})
          for country in ("US", "CN"):
              if not teams.get(country):
                  print(f"::error::Leaderboard has no {country} models")
                  sys.exit(1)
          ts = data["history"][0]["timestamp"]
          # Timestamps look like 2026-08-29T07:44:51+00:00 — fromisoformat handles them.
          dt = datetime.fromisoformat(ts)
          if dt.tzinfo is None:
              dt = dt.replace(tzinfo=timezone.utc)
          age = datetime.now(timezone.utc) - dt
          print(f"latest snapshot: {ts} (age {age})")
          if age > timedelta(hours=30):
              print(f"::error::Leaderboard data is stale ({age} old) — daily scrape may be failing silently")
              sys.exit(1)
          if age < -timedelta(minutes=5):
              print('::error::Snapshot timestamp is more than five minutes in the future')
              sys.exit(1)
          EOF

      - name: Publication revision and summary agreement
        run: |
          python3 - <<'EOF'
          import hashlib, json
          from urllib.request import urlopen
          base = 'https://usvschina.ai/'
          def read(path):
              with urlopen(base + path, timeout=30) as response:
                  return response.read()
          publication = json.loads(read('data/publication.json'))
          payloads = {path: read(path) for path in
              ('data/site_summary.json', 'data/scoring_revision.json', 'current.json')}
          for path, body in payloads.items():
              if hashlib.sha256(body).hexdigest() != publication['artifacts'].get(path):
                  raise SystemExit('Publication hash mismatch: ' + path)
          summary = json.loads(payloads['data/site_summary.json'])
          revision = json.loads(payloads['data/scoring_revision.json'])
          current = json.loads(payloads['current.json'])
          expected = publication['scoringRevision']
          if not expected or any(value != expected for value in
                  (summary['scoringRevision'], revision['scoringRevision'], current['scoringRevision'])):
              raise SystemExit('Published scoring revisions disagree')
          if summary['generationId'] != publication['generationId']:
              raise SystemExit('Published data generations disagree')
          if summary['current']['timestamp'] != current['history'][0]['timestamp']:
              raise SystemExit('Published snapshot dates disagree')
          print('Published revision, generation and current snapshot agree')
          EOF

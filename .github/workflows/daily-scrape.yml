name: Daily AI Model Scrape

on:
  schedule:
    # Run once daily at an off-peak time (3:17 AM UTC).
    - cron: '17 3 * * *'
  # Allow manual triggering from Actions tab
  workflow_dispatch:

permissions:
  contents: read
  
concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      AI_GAP_FILL_MODEL: gpt-6.1-terra
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: false
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'
      
      - name: Set up frontend build
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      
      - name: Decide AI research budget
        id: budget
        # Full AI gap-fill (web_search) runs Sundays and on manual dispatch;
        # other nights research only models first seen in the last 14 days
        # (their own budget in gap_fill_benchmarks.py) and apply cached fills.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "7" ]; then
            echo "max_calls=10" >> "$GITHUB_OUTPUT"
          else
            echo "max_calls=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Check OpenAI billing
        continue-on-error: true
        # Report AI access problems without blocking API-independent source refresh.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/check_openai_billing.py --model gpt-6-luna

      - name: Build pinned local frontend assets
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:assets

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Run test suite
        # Cheap preflight: catches dependency/version problems before the
        # ~45 minute scrape, and guards the superseded-version dedupe.
        run: python -m unittest discover -s tests
      
      - name: Run scraper
        env:
          # Used by the AI gap-filling pass (scripts/gap_fill_benchmarks.py)
          # to query OpenAI's Responses API with the web_search tool.
          # Direct-source refresh runs even when AI research is unavailable.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/scrape_models.py --gap-fill-max-calls "${{ steps.budget.outputs.max_calls }}"

      - name: Rescore retained history from refreshed evidence
        run: python scripts/rescore_history.py --write

      - name: Validate scraped data
        # Fails the run (keeping yesterday's data live) on alias-duplicate
        # benchmark columns, artifact headers, out-of-range values, or a
        # released-filter regression. See scripts/validate_models.py.
        run: |
          python scripts/validate_models.py

      - name: Run news scraper
        continue-on-error: true
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
        run: |
          python scripts/scrape_news.py

      - name: Refresh sitemap and AI resource map from the snapshot
        run: |
          python3 - <<'PYTHON'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from scrape_models import update_llms_metadata, update_sitemap_lastmod
          snapshot = json.loads(Path('current.json').read_text())['history'][0]
          date = snapshot['timestamp'][:10]
          update_sitemap_lastmod(Path('sitemap.xml'), date)
          update_llms_metadata(Path('llms.txt'), date)
          PYTHON

      - name: Prepare and verify complete publication
        # Snapshot-time deterministic rendering; never posts or researches.
        run: |
          python scripts/prepare_publication.py --write
          python scripts/prepare_publication.py

      - name: Configure git
        run: |
          git config --local user.email "${{ github.repository_owner }}@users.noreply.github.com"
          git config --local user.name "${{ github.repository_owner }}"
      
      - name: Check for changes
        id: changes
        run: |
          CHANGES=false
          git diff --quiet data/ || CHANGES=true
          git diff --quiet models.json data/model_catalog.json || CHANGES=true
          git diff --quiet current.json 2>/dev/null || CHANGES=true
          git ls-files --others --exclude-standard | grep -q current.json && CHANGES=true
          git diff --quiet news.json 2>/dev/null || CHANGES=true
          git diff --quiet sitemap.xml llms.txt 2>/dev/null || CHANGES=true
          git diff --quiet og-image.png 2>/dev/null || CHANGES=true
          git diff --quiet ig-image.png 2>/dev/null || CHANGES=true
          git diff --quiet -- '*.html' 2>/dev/null || CHANGES=true
          git diff --quiet data/ai_gap_cache.json 2>/dev/null || CHANGES=true
          git diff --quiet data/ai_fill_history.jsonl 2>/dev/null || CHANGES=true
          git ls-files --others --exclude-standard | grep -q news.json && CHANGES=true
          git ls-files --others --exclude-standard | grep -q og-image.png && CHANGES=true
          git ls-files --others --exclude-standard | grep -q ig-image.png && CHANGES=true
          git ls-files --others --exclude-standard | grep -q 'data/ai_gap_cache.json' && CHANGES=true
          git ls-files --others --exclude-standard | grep -q 'data/ai_fill_history.jsonl' && CHANGES=true
          git status --porcelain social/ data/social_history.jsonl data/social_caption_cache.json data/social_cost.jsonl | grep -q . && CHANGES=true
          echo "has_changes=$CHANGES" >> "$GITHUB_OUTPUT"

      - name: Open data feature pull request
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          # Only this final step can access the write-capable token.
          gh auth setup-git
          git fetch origin develop
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo '::error::develop advanced during generation; rerun against its latest state.'
            exit 1
          fi
          git add models.json
          git add current.json 2>/dev/null || true
          git add data/scoring_revision.json data/site_summary.json data/publication.json
          git add news.json 2>/dev/null || true
          git add og-image.png 2>/dev/null || true
          git add ig-image.png 2>/dev/null || true
          git add sitemap.xml llms.txt
          git add -- *.html 2>/dev/null || true
          # AI gap-fill cache + audit log are committed so the next run benefits
          # from prior verified positive responses and the
          # audit history is visible in git log.
          git add data/ai_gap_cache.json 2>/dev/null || true
          git add data/ai_fill_history.jsonl 2>/dev/null || true
          git add data/model_catalog.json data/historical_benchmark_gaps.json data/benchmark_source_refresh.json
          # Today's carousel (older slides are removed), rotation history,
          # caption cache and the USD ledger.
          git add -A social/ 2>/dev/null || true
          git add data/social_history.jsonl data/social_caption_cache.json data/social_cost.jsonl 2>/dev/null || true
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%S')
          git commit -m "Daily scrape run - $TIMESTAMP UTC"
          BRANCH="feature/daily-scrape-${{ github.run_id }}-${{ github.run_attempt }}"
          git switch -c "$BRANCH"
          git push origin "HEAD:refs/heads/$BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" --base develop --head "$BRANCH" \
            --title "Refresh data (daily-scrape)" \
            --body "Generated publication for review. Merge into develop, then promote develop to main to publish."
      
      - name: Notify success
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          echo "✅ Daily scrape completed successfully"
          echo "New entry created in models.json"
      
      - name: Notify no changes
        if: steps.changes.outputs.has_changes == 'false'
        run: |
          echo "ℹ️ No changes detected - data unchanged"

name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily AI Model Scrape", "Backfill gap-fill over history"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: site-delivery-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  verify_build:
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Writer workflows may create a commit after their initial head SHA.
          # Resolve main once, then carry this exact checkout through deployment.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          lfs: false
      - name: Record candidate revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: |
          python -m pip install -r scripts/requirements.txt
          npm ci --ignore-scripts --no-audit --no-fund
          python -m playwright install --with-deps chromium
      - name: Verify full historical replay and installed publication
        run: |
          python scripts/prepare_publication.py
          python scripts/validate_models.py
      - name: Build allowlisted website
        run: npm run build
      - name: Test the candidate and built artifact
        env:
          BUILT_SITE_DIR: ${{ github.workspace }}/dist
        run: python -m unittest discover -s tests
      - name: Store exact verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  build_and_deploy_job:
    needs: verify_build
    runs-on: ubuntu-latest
    name: Deploy Verified Artifact
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify_build.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: site-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
      - name: Prevent superseded production delivery
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.verify_build.outputs.sha }}
          IS_PREVIEW: ${{ github.event_name == 'pull_request' }}
        run: |
          if [ "$IS_PREVIEW" = 'true' ]; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          else
            CURRENT=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq .object.sha)
            if [ "$CURRENT" = "$CANDIDATE_SHA" ]; then
              echo 'eligible=true' >> "$GITHUB_OUTPUT"
            else
              echo 'eligible=false' >> "$GITHUB_OUTPUT"
              echo 'Candidate superseded; retaining newer production delivery.'
              # A successful workflow also triggers social publishing. This run
              # must not report delivery success when no deployment occurred.
              exit 1
            fi
          fi
      - name: Deploy without rebuilding
        if: steps.current.outputs.eligible == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_DESERT_08276C810 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          api_location: ''
          output_location: ''
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_DESERT_08276C810 }}
          action: close

name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Weekly dependency-drift report: the CHECK_LATEST run below fails if any pin
  # has fallen behind its latest release.
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install dependencies
        # The suite now exercises the real modules (gap-fill, backfill,
        # Instagram) rather than skipping them, so it needs the same pins the
        # workflows use. Playwright's browser is NOT installed - no test
        # launches one.
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Check dependencies are on latest
        # Drift is reported here, never in the daily scrape — an upstream
        # release must not stop the site publishing data.
        env:
          CHECK_LATEST: '1'
        run: python -m unittest tests.test_requirements.WheelAvailabilityTests -v

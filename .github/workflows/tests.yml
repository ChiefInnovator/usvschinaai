name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  # Weekly dependency-drift report: the CHECK_LATEST run below fails if any pin
  # has fallen behind its latest release.
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Set up frontend build
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        # The suite now exercises the real modules (gap-fill, backfill,
        # Instagram) rather than skipping them, so it needs the same pins the
        # workflows use, including real Chromium integration tests.
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r scripts/requirements.txt

      - name: Build pinned local frontend assets
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:assets

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Check dependencies are on latest
        # Drift is reported here, never in the daily scrape — an upstream
        # release must not stop the site publishing data.
        env:
          CHECK_LATEST: '1'
        run: python -m unittest tests.test_requirements.WheelAvailabilityTests -v

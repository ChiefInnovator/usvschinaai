name: Post to Instagram

on:
  workflow_run:
    workflows:
      - "Azure Static Web Apps CI/CD"
    types:
      - completed
  # Manual trigger for testing credentials without waiting for a deploy cascade
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass the once-per-day guard (credential testing only)'
        type: boolean
        default: false
      comments_only:
        description: 'Repair missing link comments without publishing media'
        type: boolean
        default: false

concurrency:
  group: instagram-publishing
  cancel-in-progress: false

jobs:
  post-instagram:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dateutil

      - name: Post to Instagram
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          IG_COMMENTS_ONLY: ${{ inputs.comments_only && '1' || '' }}
          # The script asks Instagram for its latest post and skips if that was
          # today. Only a manual dispatch with force=true bypasses it. It posts
          # the carousel in social/plan.json (written by the daily scrape) and
          # skips when there is no plan for today.
          IG_FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
        run: |
          if [ -n "$INSTAGRAM_ACCESS_TOKEN" ] && [ -n "$IG_USER_ID" ]; then
            python scripts/post_to_instagram.py
          else
            echo "::error::Instagram credentials not configured"
            exit 1
          fi

name: Bust Social Media Cache

on:
  workflow_run:
    workflows:
      - "Azure Static Web Apps CI/CD"
    types:
      - completed

jobs:
  bust-cache:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployment to propagate
        run: sleep 30

      - name: Bust Facebook OG cache
        env:
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          app_id = os.environ.get('FB_APP_ID')
          app_secret = os.environ.get('FB_APP_SECRET')
          if not app_id or not app_secret:
              raise SystemExit('::error::Facebook cache credentials not configured')
          for path in ('', '/', '/index.html', '/og-image.png'):
              url = 'https://usvschina.ai' + path
              print('Refreshing Facebook cache for ' + url)
              body = urlencode({'id': url, 'scrape': 'true',
                                'access_token': app_id + '|' + app_secret}).encode()
              request = Request('https://graph.facebook.com/', data=body)
              try:
                  with urlopen(request, timeout=30) as response:
                      result = json.load(response)
              except HTTPError as error:
                  raise SystemExit(f'::error::Facebook cache refresh failed for {url}: HTTP {error.code}') from None
              except (URLError, OSError, ValueError):
                  raise SystemExit(f'::error::Facebook cache refresh failed for {url}: request or response error') from None
              if not isinstance(result, dict) or 'error' in result or result.get('success') is False:
                  raise SystemExit(f'::error::Facebook cache refresh failed for {url}: API rejected request')
          print('Facebook OG cache refreshed')
          PY

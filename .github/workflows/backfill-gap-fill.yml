name: Backfill gap-fill over history

# Researches dated evidence for retained models; always replays ALL history.
# The research window never limits an algorithm migration. Manual only.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Research model-selection window in days; scoring always replays all history'
        default: '45'
      max_calls:
        description: 'Live API call ceiling for the whole run'
        default: '80'
      model:
        description: 'Research model'
        default: 'gpt-6-luna'

permissions:
  contents: read

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: false
          fetch-depth: 0

      - name: Verify publishing token
        # Fail before paid research when the run could not open its pull request.
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY" --silent; then
            echo '::error::PAT_TOKEN is missing, expired or revoked; the run could not open its pull request.'
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Set up frontend build
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r scripts/requirements.txt

      - name: Build pinned local frontend assets
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:assets

      - name: Check OpenAI billing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEARCH_MODEL: ${{ inputs.model }}
        run: python scripts/check_openai_billing.py --model "$RESEARCH_MODEL"

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run test suite
        run: python -m unittest discover -s tests

      - name: Refresh dated benchmark sources
        run: python scripts/refresh_benchmark_sources.py --write

      - name: Backfill
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEARCH_DAYS: ${{ inputs.days }}
          RESEARCH_CALLS: ${{ inputs.max_calls }}
          RESEARCH_MODEL: ${{ inputs.model }}
        run: |
          python scripts/research_history.py --write \
            --days "$RESEARCH_DAYS" --max-calls "$RESEARCH_CALLS" --model "$RESEARCH_MODEL"
          python scripts/rescore_history.py --write

      - name: Validate
        run: python scripts/validate_models.py

      - name: Prepare and verify all historical scores
        run: |
          python scripts/prepare_publication.py --write
          python scripts/prepare_publication.py

      - name: Open data feature pull request
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          RESEARCH_DAYS: ${{ inputs.days }}
          RESEARCH_MODEL: ${{ inputs.model }}
        run: |
          # Only this step and the token preflight can access the write-capable token.
          gh auth setup-git
          git fetch origin develop
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo '::error::develop advanced during generation; rerun against its latest state.'
            exit 1
          fi
          git add models.json current.json data/model_catalog.json data/scoring_revision.json data/site_summary.json data/publication.json data/historical_benchmark_gaps.json og-image.png ig-image.png social/ data/social_caption_cache.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models.json current.json data/model_catalog.json data/ai_gap_cache.json data/ai_fill_history.jsonl data/ai_gap_backfill_asked.json
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "Backfill gap-fill over $RESEARCH_DAYS days ($RESEARCH_MODEL)"
          BRANCH="feature/backfill-${{ github.run_id }}-${{ github.run_attempt }}"
          git switch -c "$BRANCH"
          git push origin "HEAD:refs/heads/$BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" --base develop --head "$BRANCH" \
            --title "Refresh data (backfill)" \
            --body "Generated publication for review. Merge into develop, then promote develop to main to publish."

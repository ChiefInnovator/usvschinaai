    <!-- News headlines -->
    <script>
    (function() {
        function timeAgo(dateStr) {
            AppContract.check("timeAgo", arguments, ["?json"]);
            if (!dateStr) return '';
            try {
                var date = new Date(dateStr);
                var now = new Date();
                var diffMs = now - date;
                var diffMin = Math.floor(diffMs / 60000);
                if (diffMin < 1) return 'just now';
                if (diffMin < 60) return diffMin + 'm ago';
                var diffHr = Math.floor(diffMin / 60);
                if (diffHr < 24) return diffHr + 'h ago';
                var diffDay = Math.floor(diffHr / 24);
                if (diffDay < 7) return diffDay + 'd ago';
                return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            } catch (e) {
                return '';
            }
        }

        function getCountryFlag(country) {
            AppContract.check("getCountryFlag", arguments, ["?json"]);
            if (country === 'CN') return '\u{1F1E8}\u{1F1F3}';
            if (country === 'US') return '\u{1F1FA}\u{1F1F8}';
            return '\u{1F30D}';
        }

        function escapeHtml(str) {
            AppContract.check("escapeHtml", arguments, ["?json"]);
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }

        async function loadNewsHeadlines() {
            AppContract.check("loadNewsHeadlines", arguments, []);
            var container = document.getElementById('newsHeadlines');
            if (!container) return;

            try {
                var response = await fetch('news.json');
                if (!response.ok) throw new Error('news.json ' + response.status);
                var data = await response.json();
                var items = data && Array.isArray(data.items) ? data.items : [];
                if (items.length === 0) { container.innerHTML = '<p role="status">No headlines collected yet.</p>'; return; }

                // Newest first; relevance only breaks ties. Sorting by relevance alone
                // kept week-old headlines ahead of today's.
                items.sort(function(a, b) {
                    var newer = (Date.parse(b.publishedAt) || 0) - (Date.parse(a.publishedAt) || 0);
                    return newer || (b.relevanceScore || 0) - (a.relevanceScore || 0);
                });
                var links = items.map(function(item) {
                    try {
                        var url = new URL(item.url);
                        if (!['http:', 'https:'].includes(url.protocol)) return '';
                        var time = timeAgo(item.publishedAt);
                        return '<li><a href="' + escapeHtml(url.href) + '" target="_blank" rel="noopener noreferrer">' +
                            escapeHtml(item.headline) + '<small>' + escapeHtml(item.source) +
                            (time ? ' · ' + escapeHtml(time) : '') + '</small></a></li>';
                    } catch { return ''; }
                }).join('');
                container.innerHTML = '<ul>' + links + '</ul>';
            } catch (e) {
                console.log('News headlines: could not load news.json', e);
                container.innerHTML = '<p role="status">News could not be loaded. Reload to try again.</p>';
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadNewsHeadlines);
        } else {
            loadNewsHeadlines();
        }
    })();
    </script>
